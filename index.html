<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>덩굴숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* 루소의 납작한 정글 + 멕시코 봉헌화(레타블로). HUD는 남색 판, 기록은 양철 액자 */
:root{
  --bg:#1a2a1e; --ink:#f6ead2; --dim:#c9bda4; --panel:rgba(30,24,64,.8); --line:rgba(246,234,210,.18);
  --marigold:#f2a93b; --rose:#ff5f8f; --teal:#2aa6a6; --paper:#f3e6c8; --brown:#4a2a16;
  --display:'Gowun Batang','Nanum Myeongjo',serif;
  --hand:'Nanum Pen Script','Gowun Batang',cursive;
  --body:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{overflow:hidden;font-family:var(--body)}
canvas#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
canvas#o{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  padding:10px 14px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hud h1{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.02em}
.hud .stat{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.hud .stat b{color:var(--marigold);font-weight:600}
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 190px)}
.tools button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:12px var(--body);cursor:pointer}
.tools button:hover,.tools button:focus-visible{color:var(--ink);border-color:var(--dim)}
.tools #albumBtn{color:var(--marigold);border-color:rgba(242,169,59,.5)}
button:focus-visible,input:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 80px);
  width:max-content;max-width:calc(100vw - 32px);text-align:center;padding:8px 14px;font-size:13px;color:var(--dim);line-height:1.5;transition:opacity 1s;pointer-events:none}
.chat{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:min(360px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:flex;flex-direction:column;gap:6px;margin:0}
.log{display:flex;flex-direction:column;gap:3px;pointer-events:none}
.log div{align-self:flex-start;max-width:100%;padding:4px 9px;font-size:13px;line-height:1.45;overflow-wrap:anywhere;transition:opacity 1.2s}
.log div.old{opacity:0}
.log b{font-weight:600;margin-right:6px}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:14px var(--body)}
.row input::placeholder{color:var(--dim)}
.row button{background:var(--marigold);color:#3a2206;border:0;border-radius:6px;padding:0 14px;font:600 13px var(--body);cursor:pointer}

/* 레타블로 */
.veil{position:fixed;inset:0;background:rgba(14,10,36,.72);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));z-index:5}
.retablo{margin:0;padding:10px;border-radius:4px;width:100%;max-width:320px;
  background:repeating-conic-gradient(from 45deg,var(--marigold) 0 25%,var(--rose) 0 50%,var(--teal) 0 75%,#f6ead2 0 100%) 0 0/14px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.retablo canvas{display:block;width:100%;height:auto;aspect-ratio:28/17;border:3px solid #3a2410;background:#2b2a6e}
.retablo figcaption{background:var(--paper);color:var(--brown);padding:10px 12px 12px;border:3px solid #3a2410;border-top:0;font-family:var(--hand);display:flex;flex-direction:column;gap:2px}
.retablo .date{font-size:17px;opacity:.75}
.retablo b{font-size:25px;font-weight:400;line-height:1.1}
.retablo p{margin:2px 0 0;font-size:20px;line-height:1.25}
.retablo .with{font-size:17px;opacity:.75;margin-top:4px}
.retablo.empty{background:none;border:2px dashed var(--line);box-shadow:none;display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--dim);font:13px var(--body)}
.pop{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px}
.pop .tag{font:13px var(--body);letter-spacing:.12em;color:var(--marigold)}
.namebox{width:100%;max-width:340px;padding:22px;display:flex;flex-direction:column;gap:10px;margin:0}
.namebox h2{margin:0;font:700 22px var(--display)}
.namebox p{margin:0;color:var(--dim);font-size:13px}
.namebox input{background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:15px var(--body)}
.pop button,.album header button,.namebox button{background:var(--marigold);color:#3a2206;border:0;border-radius:6px;padding:10px 18px;font:600 14px var(--body);cursor:pointer}
.album{width:100%;max-width:1080px;max-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px;overflow:hidden}
.album header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.album h2{margin:0;font:700 22px var(--display)}
.album h2 span{font:13px var(--body);color:var(--dim);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;overflow-y:auto;padding:4px}
.grid .retablo{max-width:none}
@media (prefers-reduced-motion:reduce){.hint,.log div{transition:none}}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="정글 탐험 화면"></canvas>
<canvas id="o" aria-hidden="true"></canvas>
<div class="hud panel"><h1>덩굴숲</h1><div class="stat" id="stat">낮 · 혼자</div></div>
<div class="tools"><button id="nameBtn" type="button">이름</button><button id="albumBtn" type="button">그림첩 0/6</button><button id="sound" type="button">소리 켜기</button><button id="reset" type="button">처음부터</button></div>
<div class="hint panel" id="hint"></div>
<form class="chat" id="chat" autocomplete="off">
  <div class="log" id="log" aria-live="polite"></div>
  <div class="row"><input id="say" maxlength="80" placeholder="Enter 눌러 말하기" aria-label="채팅 입력"><button type="submit">말하기</button></div>
</form>
<div class="veil" id="popVeil" hidden><div class="pop"><span class="tag">새로운 기적</span><div id="popCard" style="width:100%;display:flex;justify-content:center"></div><button id="popClose" type="button">그림첩에 넣기</button></div></div>
<div class="veil" id="nameVeil" hidden><form class="namebox panel" id="nameForm"><h2>숲에서 불릴 이름</h2><p>함께 들어온 사람들 머리 위에 보여요.</p><input id="nameInput" maxlength="12" placeholder="예: 느린 앵무새" aria-label="이름"><button type="submit">숲으로 들어가기</button></form></div>
<div class="veil" id="albumVeil" hidden><div class="album panel"><header><h2>기적 그림첩<span id="albumCount"></span></h2><button id="albumClose" type="button">닫기</button></header><div class="grid" id="grid"></div></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
/* ================= 그래픽 교체용 =================
   assets/ 폴더에 아래 이름의 png를 넣으면 기본 그림 대신 그 그림판으로 바뀌어요. 크기와 비율은 README 참고.
   모두 정면에서 본 모습, 투명 배경, 아래가 땅에 닿게. */
const ASSET_NAMES = ['agave','grass','broadleaf','fern','lily','whitespike','heartleaf','banana','sansevieria','palm','tree','orangetree','lotus','flamingo','tiger','monkey','ruin','player','parrot','leaf'];
const ASSETS = Object.fromEntries(ASSET_NAMES.map(n => [n, 'assets/' + n + '.png']));
const COLORS = {
  // 앙리 루소 「적도의 정글」(1909)에서 고른 색
  rousseau:{ deep:'#1c3428', dark:'#26443a', mid:'#355a45', sage:'#4d7356', moss:'#6a8a5a', pale:'#9db07a', agave:'#b9c98a', cream:'#ece6b4',
    vein:'#86a888', line:'#14261c', pink:'#ec9f86', pinkDeep:'#d77b66', white:'#f1edb6' },
  floor:'#3d5a3e', floorMark:'#56744f',
  leaves:['#2d4f3a','#4d7356','#26443a','#6a8a5a'], leafLine:'#14261c',
  flowers:['#ec9f86','#f1edb6','#d77b66'], flowerEye:'#e8c36a',
  tree:'#1c3428', water:'#3e6f6a', waterHi:'#8fb5a6', ruin:'#a58b6a', ruinLine:'#6e5a44', ruinDot:'#c9a46a',
  me:'#f2a93b', eye:'#1a120a', jaguar:'#ffd34a'
};
/* ================================================ */

const IMG = {};
for (const [k,src] of Object.entries(ASSETS)) if (src) { const im = new Image(); im.onload = () => { IMG[k] = im; onAsset(k, im); }; im.onerror = () => {}; im.src = src; }

const W = 96, H = 96, T = 28, DAY = 180;
const FLOOR = 0, BUSH = 1, TREE = 2, WATER = 3, RUIN = 4;
const SPEED = 3.2, BUSH_SPEED = 1.9;

const cv = document.getElementById('c'), ov = document.getElementById('o'), ctx = ov.getContext('2d');
let vw, vh;
function resize(){ const d = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight; ov.width = vw*d; ov.height = vh*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();

function rng(s){ return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise(seed, G = 64){
  const r = rng(seed), v = new Float32Array(G*G); for (let i = 0; i < v.length; i++) v[i] = r();
  const g = (a,b) => v[((a%G+G)%G) + ((b%G+G)%G)*G];
  return (x,y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x-xi, fy = y-yi, sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
    const a = g(xi,yi) + (g(xi+1,yi)-g(xi,yi))*sx, b = g(xi,yi+1) + (g(xi+1,yi+1)-g(xi,yi+1))*sx; return a + (b-a)*sy; };
}
const hash = k => { let h = Math.imul(k ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; return (Math.imul(h, 0xc2b2ae35) >>> 0) / 4294967296; };
const BAD = new RegExp('[' + [[0,31],[127,159],[173,173],[8203,8207],[8232,8238],[8288,8303],[65279,65279]].map(([a,b]) => String.fromCharCode(92)+'u'+a.toString(16).padStart(4,'0')+'-'+String.fromCharCode(92)+'u'+b.toString(16).padStart(4,'0')).join('') + ']', 'g');
const clean = s => String(s).replace(BAD, '').trim().slice(0, 80);

/* ---- 기적의 자리들 ---- */
const SITES = [
  { key:'labels', name:'꽃비 속의 빈 해먹', text:'온 마을이 한꺼번에 낮잠에 들었다가 어디론가 가 버렸다. 해먹마다 사람 모양으로 쌓인 노란 꽃잎만 남았다. 꽃비는 그날부터 그치지 않았다.' },
  { key:'rising', name:'빨래를 걷던 자리', text:'흰 이불을 개던 여자가 이불째 하늘로 올라갔다. 남은 사람들은 잠깐 올려다보고는 나머지 빨래를 마저 갰다.' },
  { key:'butterflies', name:'노란 나비 공터', text:'이 공터를 지난 사람 뒤로는 노란 나비가 따라붙는다. 아무도 이유를 묻지 않았고, 나비도 말하지 않았다.' },
  { key:'fork', name:'두 갈래 돌', text:'이 돌에서 길은 둘로 갈라진다. 어느 쪽을 골라도, 다른 쪽을 고른 내가 그 숲을 걷고 있다.' },
  { key:'mirror', name:'거울 연못', text:'연못에 비친 숲에는 아직 아무도 들어가 보지 않았다. 달은 그쪽 하늘에 하나 더 떠 있다.' },
  { key:'oldman', name:'백 살 노인의 돌', text:'돌 위의 노인은 백 년 전 장마 이야기를 어제 일처럼 했다. 그는 처음 보는 우리 이름을 이미 알고 있었다.' }
];
const OLDMAN_LINES = ['그해 비는 아무도 셀 수 없을 만큼 오래 왔지.', '자네 이름은 알아. 자네가 오기 전부터.', '길을 잃었다고? 여기선 다들 그렇게 도착하지.', '앵무새 말은 믿지 말게. 다 사람한테 배운 거야.'];
const PARROT_SEED = ['올라!', '비가 온다, 비가 온다', '이름을 잊지 마!', '길은 둘이야, 둘!', '누구 왔어? 누구 왔어?', '노란 나비! 노란 나비!'];

/* ---- 지도 (시드 고정이라 모두 같은 숲) ---- */
const R = rng(20261105), n1 = noise(11, 8), n2 = noise(29, 24);   // 지도 크기에 맞춰 반복되는 지형이라 끝과 끝이 이음매 없이 이어짐
const type = new Uint8Array(W*H), bent = new Float32Array(W*H), sway = new Float32Array(W*H);
const id = (x,y) => (((x % W) + W) % W) + (((y % H) + H) % H)*W;
const wd = (d, N) => d - N*Math.round(d/N);   // 이어진 숲에서의 가장 가까운 차이
const wdist = (ax, ay, bx, by) => Math.hypot(wd(ax - bx, W), wd(ay - by, H));
const wrapX = x => ((x % W) + W) % W, wrapY = y => ((y % H) + H) % H;
const border = () => false;   // 끝과 끝이 이어져 있어 가장자리가 없음
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const n = n1(x/12, y/12)*.65 + n2(x/4, y/4)*.35; let t;
  if (n < .3) t = WATER;
  else { const r = R(); t = r < .1 ? TREE : (n > .66 && r < .6) ? FLOOR : BUSH; }
  type[id(x,y)] = t;
}
const setT = (x,y,t) => { if (!border(x,y)) type[id(x,y)] = t; };
function clear(cx,cy,rad){ for (let y = Math.floor(cy-rad); y <= cy+rad; y++) for (let x = Math.floor(cx-rad); x <= cx+rad; x++) if ((x+.5-cx)**2 + (y+.5-cy)**2 <= rad*rad) setT(x,y,FLOOR); }
const SX = W/2|0, SY = H/2|0;
const FIRE = { x:SX+.5, y:SY+.5 };   // 출발점의 모닥불
SITES.forEach((s,i) => {
  let x, y, n = 0;
  do { x = 6 + R()*(W-13) | 0; y = 6 + R()*(H-13) | 0; n++; }
  while ((wdist(x, y, SX, SY) < 14 || SITES.slice(0,i).some(o => wdist(o.x, o.y, x, y) < 16)) && n < 800);
  s.x = x; s.y = y; s.cx = x + 1; s.cy = y + 1;
  for (let cx = Math.min(SX,x); cx <= Math.max(SX,x); cx++) if (type[id(cx,SY)] !== FLOOR) setT(cx,SY,BUSH);
  for (let cy = Math.min(SY,y); cy <= Math.max(SY,y); cy++) if (type[id(x,cy)] !== FLOOR) setT(x,cy,BUSH);
  clear(x+1, y+1, s.key === 'labels' ? 3.6 : 2.8);
  for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) setT(x+dx, y+dy, s.key === 'mirror' ? WATER : RUIN);
  if (s.key === 'labels') { setT(x-2, y-1, TREE); setT(x+3, y+2, TREE); setT(x+3, y-1, WATER); }
});
clear(SX+.5, SY+.5, 3.2);
const SITE = Object.fromEntries(SITES.map(s => [s.key, s]));
// 이름표 마을의 이름표들
const LABELS = [];   // 가까이 가면 위로 떠오르는 이름표
{ const s = SITE.labels, names = { [TREE]:'이것은 나무다', [WATER]:'이것은 물이다. 마실 수 있다', [BUSH]:'덤불. 헤치고 지나갈 것', [FLOOR]:'땅. 밟아도 된다' };
  for (let y = s.cy-5; y <= s.cy+5; y++) for (let x = s.cx-5; x <= s.cx+5; x++) {
    if (border(x,y) || Math.hypot(x+.5-s.cx, y+.5-s.cy) > 5) continue;
    const k = id(x,y), t = type[k];
    if (t === TREE || t === WATER || (t !== RUIN && hash(k*23) < .18)) LABELS.push({ x:x+.5, y:y+.5, text:names[t], a:0 });
  }
  LABELS.push({ x:s.cx, y:s.cy, text:'이것은 돌이다. 앉아도 된다', a:0 }); }
// 앵무새: 나무 곁 공터에
const PARROTS = [];
{ const spots = [];
  for (let y = 2; y < H-2; y++) for (let x = 2; x < W-2; x++) {
    if (type[id(x,y)] !== FLOOR) continue;
    if ([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b]) => type[id(x+a,y+b)] === TREE)) spots.push([x,y]);
  }
  const pick = (x,y) => PARROTS.push({ x:x+.5, y:y+.5, col:PARROTS.length % 2, heard:[], cool:2, bubble:null });
  pick(SX+2, SY-2);
  for (let tries = 0; tries < 2000 && PARROTS.length < 11; tries++) {
    const [x,y] = spots[R()*spots.length | 0] || [0,0];
    if (PARROTS.every(p => wdist(p.x, p.y, x, y) > 12)) pick(x,y);
  } }

/* ---- 상태 ---- */
const P = { x:SX+.5, y:SY+2.4, fx:0, fy:-1, r:.3, moving:false, flip:1, sit:false };
let yaw = 0;   // 카메라가 바라보는 방향. 판들이 늘 카메라를 향해 돌아서서 360도 돌아볼 수 있음
const YAW_MAX = Infinity;
let clock = 0, myColor = COLORS.me, myBubble = null, myId = null, oldmanT = 0;
const others = new Map(), parts = [], sheets = [];
let found = {};   // key -> { date, with:[이름] }

const solid = t => t === WATER || t === RUIN;   // 나무는 줄기 둘레만 따로 막음
function blocked(x,y){
  if (wdist(x, y, FIRE.x, FIRE.y) < .35) return true;
  for (const [ox,oy] of [[-P.r,-P.r],[P.r,-P.r],[-P.r,P.r],[P.r,P.r]]) {
    const tx = Math.floor(x+ox), ty = Math.floor(y+oy);
    if (solid(type[id(tx,ty)])) return true;
  }
  return false;
}
const tileAt = (x,y) => type[id(Math.floor(x), Math.floor(y))];

function disturb(x,y,dt,moving){
  if (!moving) return;
  for (let ty = (y|0)-1; ty <= (y|0)+1; ty++) for (let tx = (x|0)-1; tx <= (x|0)+1; tx++) {
    const k = id(tx,ty); if (type[k] !== BUSH) continue;
    const d = Math.hypot(tx+.5-x, ty+.5-y);
    if (d < 1.3) sway[k] = 1;
    if (d < .6) bent[k] = Math.min(1, bent[k] + dt*.7);
  }
  if (tileAt(x,y) === BUSH && Math.random() < dt*9 && parts.length < 140) {

  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = .7;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
    const g = ac.createGain(); g.gain.value = 0;

    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; const rg = ac.createGain(); rg.gain.value = 0;

  const wob = .6 + .4*Math.abs(Math.sin(clock*11)) * (.7 + .3*Math.sin(clock*3.7));

  if (!audio || !soundOn) return;

    const { ac } = audio, o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;

const SCALE = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];

function playNote(inst, n, vol = 1){
  if (!audio || !soundOn || vol <= 0) return;
  try {
    const { ac } = audio, t = ac.currentTime, out = ac.createGain(); out.gain.value = .35*vol; out.connect(ac.destination);
    if (inst === 'marimba') {
      for (const [mul, amp] of [[1, 1], [4, .18]]) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = SCALE[n]*mul;
        g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(.001, t + (mul > 1 ? .2 : .9)); o.connect(g).connect(out); o.start(t); o.stop(t + 1); }
    } else if (inst === 'drum') {
      const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(70 + n*14, t); o.frequency.exponentialRampToValueAtTime(40, t + .35);
      g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .45); o.connect(g).connect(out); o.start(t); o.stop(t + .5);
    } else {
      const len = ac.sampleRate*.12 | 0, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 3);
      const src = ac.createBufferSource(), hp = ac.createBiquadFilter(); src.buffer = buf; hp.type = 'highpass'; hp.frequency.value = 2500 + n*300;
      src.connect(hp).connect(out); src.start(t);
    }
  } catch (e) {}
}

hammockBar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:600 14px var(--body);cursor:pointer';
document.body.append(hammockBar);
const nearHammock = () => HAMMOCKS.find(h => wdist(P.x, P.y, h.x, h.z) < 1.4);
function toggleLie(){
  if (P.lie) { P.lie = false; return; }
  const h = nearHammock(); if (!h) return;
  P.x = h.x + (P.x - h.x)*.2; P.y = h.z + (P.y - h.z)*.2; P.lie = true; pitch = .55;
}
hammockBar.addEventListener('click', () => { toggleLie(); cv.focus(); });
addEventListener('keydown', e => { if (e.target === $say || modalOpen() || hammockBar.hidden) return; if (e.code === 'KeyF' || (e.key || '') === 'ㄹ') toggleLie(); });
function updateLie(){
  if (P.lie && P.moving) P.lie = false;
  const can = P.lie || !!nearHammock();
  hammockBar.hidden = !can;
  if (can) hammockBar.textContent = P.lie ? '일어나기' + (MOBILE ? '' : ' (F)') : '해먹에 눕기' + (MOBILE ? '' : ' (F)');
  if (P.lie) pitch += (.55 - pitch)*.05;
}

/* ---- 정글 소리: 매미 울음, 열대 새, 멀리 짖는원숭이, 밤엔 개구리. 해먹 공터에 가까울수록 조용해짐 ---- */
let amb = null, birdT = 2, howlT = 18, frogT = 1, toucanT = 9;
function noiseBuf(ac, sec){ const b = ac.createBuffer(1, ac.sampleRate*sec | 0, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; return b; }
function tone(ac, type, f0, f1, t, dur, vol, filt){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur*.8);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.03, dur*.3)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = o.connect(g); if (filt) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; node = g.connect(f); node.connect(ac.destination); } else g.connect(ac.destination);
  o.start(t); o.stop(t + dur + .02);
}
function updateAmbience(dt, nt){
  if (!audio) return;
  const { ac } = audio, quiet = (1 - hushLevel)*(soundOn ? 1 : 0), t = ac.currentTime, day = 1 - nt;
  if (!amb) try {
    const mk = (fq, q, rate, depth) => { const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
      src.buffer = noiseBuf(ac, 2); src.loop = true; bp.type = 'bandpass'; bp.frequency.value = fq; bp.Q.value = q; g.gain.value = 0;
      lfo.frequency.value = rate; lg.gain.value = depth; lfo.connect(lg).connect(g.gain); lfo.start(); src.connect(bp).connect(g).connect(ac.destination); src.start(); return g; };
    amb = { cicada:mk(4300, 9, 19, .006), insects:mk(6800, 4, 5, .002) };
  } catch (e) { amb = {}; }
  if (amb.cicada) { amb.cicada.gain.setTargetAtTime(.02*quiet*(.4 + day*.8), t, .5); amb.insects.gain.setTargetAtTime(.01*quiet*(.4 + nt), t, .5); }
  if (quiet < .05) return;
  try {
    if ((birdT -= dt) <= 0) {   // 열대 새의 휘파람
      birdT = 3 + Math.random()*6; if (day > .3) { const f = 1600 + Math.random()*1400; [0, .18, .36].slice(0, 1 + (Math.random()*3 | 0)).forEach(o => tone(ac, 'sine', f, f*(1.4 + Math.random()*.3), t + o, .14, .02*quiet*day)); }
    }
    if ((toucanT -= dt) <= 0) {   // 큰부리새의 쉰 울음
      toucanT = 10 + Math.random()*14; if (day > .3) for (let i = 0; i < 3; i++) tone(ac, 'square', 360, 300, t + i*.22, .12, .012*quiet*day, 900);
    }
    if ((howlT -= dt) <= 0) {   // 멀리서 짖는원숭이 (해 뜰 무렵과 해질녘에 잦음)
      howlT = 30 + Math.random()*40;
      const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(); src.buffer = noiseBuf(ac, 3); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 3;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05*quiet, t + 1.1); g.gain.exponentialRampToValueAtTime(.0001, t + 2.8);
      src.connect(bp).connect(g).connect(ac.destination); src.start(t); src.stop(t + 3);
    }
    if (nt > .5 && (frogT -= dt) <= 0) {   // 밤의 개구리 "코-키"
      frogT = .6 + Math.random()*2.2; const v = .02*quiet*(nt - .5)*2*(.4 + Math.random()*.6);
      tone(ac, 'sine', 1150, 1150, t, .09, v); tone(ac, 'sine', 1750, 2100, t + .12, .14, v);
    }
  } catch (e) {}
}

/* ---- 밤이 되면 범선 창에 불이 켜짐 ---- */
const LAMP_TEX = ctex(32, 32, (g) => { g.fillStyle = '#ffd87a'; g.fillRect(6, 6, 20, 20); g.strokeStyle = '#5b3a22'; g.lineWidth = 3; g.strokeRect(6, 6, 20, 20); g.beginPath(); g.moveTo(16, 6); g.lineTo(16, 26); g.moveTo(6, 16); g.lineTo(26, 16); g.stroke(); });
const lamp = cutout(plane(.32, .32, false), new THREE.MeshBasicMaterial({ map:LAMP_TEX, alphaTest:.3, side:THREE.DoubleSide, fog:false }));
const lampGlow = cutout(plane(1.6, 1.6, false), new THREE.MeshBasicMaterial({ map:GLOW_TEX, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, opacity:.6 }));
function updateLamp(nt, camX, camZ){
  const g = STORIES.find(s => s.key === 'galleon'); if (!g) return;
  const on = nt > .55; lamp.visible = lampGlow.visible = on; if (!on) return;
  const ang = g.me.rotation.y, lx = Math.cos(ang), lz = -Math.sin(ang), nx = Math.sin(ang), nz = Math.cos(ang);
  const x = g.x + lx*.7 + nx*.06, z = g.y + lz*.7 + nz*.06;
  lamp.position.set(x, 2.0, z); lamp.rotation.y = ang;
  lampGlow.position.set(x + nx*.05, 2.0, z + nz*.05); lampGlow.rotation.y = ang; lampGlow.material.opacity = .45 + Math.sin(clock*3)*.08;
}

/* ---- 흔들의자: 바라보면 멈춤 ---- */
let chairRock = 1;
function updateChair(dt){
  const st = STORIES.find(s => s.key === 'chair'); if (!st) return;
  const sc = toScreen(st.x, .6, st.y), d = wdist(P.x, P.y, st.x, st.y);
  const watched = sc && d < 9 && Math.hypot(sc[0] - vw/2, sc[1] - vh/2) < Math.min(vw, vh)*.22;
  chairRock += ((watched ? 0 : 1) - chairRock)*Math.min(1, dt*(watched ? 9 : .8));
  st.me.rotation.z = Math.sin(clock*1.6)*.14*chairRock;
}

function draw(dt = .016){
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  updateObs(dt); const e = 0;   // 시점은 늘 같음. 멈춰 있으면 동물만 나옴
  const camX = P.x - fx*CAM_D, camZ = P.y - fz*CAM_D, elevP = elevAt(P.x, P.y);
  camera.position.set(camX, CAM_H + elevP, camZ);
  camera.lookAt(P.x + fx*3, 1.05 + elevP + Math.sin(pitch)*2.5, P.y + fz*3);
  const actors = [{ x:P.x, y:P.y, w:1 - e }]; for (const o of others.values()) actors.push({ x:o.rx, y:o.ry });
  updateBushes(actors, dt, camX, camZ);
  updateTrees(dt, camX, camZ);
  // 낮과 밤
  const { dark, label } = dayState(), nt = Math.max(0, Math.min(1, (dark - .12)/.66));
  const dusk = Math.max(0, 1 - Math.abs(nt - .45)*2.6), st = stormLevel();
  U.uTime.value = clock; U.uWind.value = .05 + .22*st;
  tintCol.copy(DAY_TINT).lerp(NIGHT_TINT, nt).lerp(DUSK_TINT, dusk*.45).multiplyScalar(1 - .3*st); for (const m of tinted) m.color.copy(tintCol);
  scene.background.copy(DAY_SKY).lerp(NIGHT_SKY, nt).lerp(DUSK_SKY, dusk*.75).lerp(STORM_SKY, st*.65); hazeCol.copy(FAR_COL).multiply(tintCol); scene.fog.color.copy(scene.background).lerp(hazeCol, .6);
  openS += (Math.max(0, Math.min(1, (openness() - .35)/.5)) - openS)*Math.min(1, dt*1.2);   // 덤불이 적은 곳일수록
  const view = (1 + elevP*.4)*(1 + openS*1.4)*(energy < 30 ? .55 + .45*energy/30 : 1)*(MOBILE ? .85 : 1);   // 바위 위에선 멀리, 지치면 가까이
  scene.fog.near = 2 - 1*nt; scene.fog.far = (17 - 6*nt - 5*st)*view; ringR = Math.max(9, scene.fog.far + 1); U.uCull.value = ringR;
  updateRings(camX, CAM_H + elevP, camZ, elevP);
  // 낮엔 옅은 해, 해질녘엔 크고 붉은 해(「해 질 녘의 처녀림」), 밤엔 큰 달(「뱀 부리는 여인」)
  sky.material.map = nt > .55 ? MOON_TEX : dusk > .35 ? RED_SUN_TEX : SUN_TEX;
  sky.visible = st < .6;
  sky.scale.setScalar(nt > .55 ? 1.35 : 1 + dusk*.9);
  sky.position.set(camX + fx*ringR*1.3, CAM_H + elevP + ringR*1.3*Math.tan(ringAng)*(1 - .3*dusk) + 2.4 - 2*dusk, camZ + fz*ringR*1.3); sky.lookAt(camera.position);
  if (st > .5 && Math.random() < dt*.22) { flash = 1; setTimeout(thunder, 500 + Math.random()*900); }
  flash = Math.max(0, flash - dt*3);
  if (audio && audio.rg) audio.rg.gain.setTargetAtTime(soundOn ? st*.1 : 0, audio.ac.currentTime, .3);
  // 사람들 (판은 늘 카메라 쪽을 봄, 걷는 방향으로 좌우 뒤집힘)
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  myMesh.position.set(P.x, elevP, P.y); myMesh.rotation.y = yaw;
  if (P.moving) { const s = P.fx*rx + P.fy*rz; if (Math.abs(s) > .2) P.flip = s < 0 ? -1 : 1; }
  myMesh.scale.set(P.flip || 1, P.sit ? .72 : 1, 1); myMesh.visible = e < .6;
  for (const [key, o] of others) {
    let me = peopleMeshes.get(key);
    if (!me || me.userData.color !== o.color) { if (me) scene.remove(me); me = cutout(personGeo, mat(personTex(o.color))); me.userData.color = o.color; peopleMeshes.set(key, me); }
    me.position.set(o.rx, elevAt(o.rx, o.ry), o.ry); me.rotation.y = yaw;
    if (o.m) { const s = o.fx*rx + o.fy*rz; if (Math.abs(s) > .2) o.flip = s < 0 ? -1 : 1; }
    me.scale.set(o.flip || 1, o.sit ? .72 : 1, 1);
  }
  for (const [key, me] of peopleMeshes) if (!others.has(key)) { scene.remove(me); peopleMeshes.delete(key); }
  PARROTS.forEach((p, i) => { p.mesh.rotation.y = yaw; p.mesh.position.y = Math.abs(Math.sin(clock*3 + i))*.03; });
  oldman.rotation.y = yaw;
  const face = me => { me.rotation.y = Math.atan2(camX - me.position.x, camZ - me.position.z); };
  ALTARS.forEach(face); TIGERS.forEach(face); MONKEYS.forEach(face); critters.forEach(c => face(c.me));
  for (const st of STORIES) { face(st.me); if (st.key === 'swing') st.me.rotation.z = Math.sin(clock*.8)*.12; }
  updateChair(dt); updateLamp(nt, camX, camZ);
  // 이불, 나비, 흩날리는 잎, 반딧불, 재규어 눈
  sheetMeshes.forEach((me, i) => { const s = sheets[i]; me.visible = !!s; if (s) { me.position.set(s.x + Math.sin(clock + i)*.3 + (s.h - 1)*.15, s.h, s.z); me.rotation.set(0, yaw, Math.sin(clock*2 + i)*.25); me.material.depthTest = s.h < 5.5; me.scale.setScalar(1 + s.h*.05); } });
  const bf = [];
  const bs = SITE.butterflies;
  for (let i = 0; i < 9; i++) bf.push([bs.cx + Math.sin(clock*.7 + i*2.3)*2.2, .8 + Math.sin(clock*1.3 + i)*.4, bs.cy + Math.cos(clock*.9 + i*1.7)*1.8, i]);
  const followers = [{ x:P.x, y:P.y, on:!!found.butterflies }, ...[...others.values()].map(o => ({ x:o.rx, y:o.ry, on:o.bf }))];
  for (const f of followers) if (f.on) for (let i = 0; i < 3; i++) bf.push([f.x + Math.cos(clock*1.3 + i*2.1)*.6, 1.2 + Math.sin(clock*1.7 + i*2.1)*.25, f.y + Math.sin(clock*1.1 + i*2.1)*.4, i]);
  hintButterflies(bf);
  bflyMeshes.forEach((me, i) => { const b = bf[i]; me.visible = !!b; if (b) { me.position.set(b[0], b[1], b[2]); me.rotation.y = yaw; me.scale.x = .3 + Math.abs(Math.sin(clock*16 + b[3]))*.9; } });
  leafMeshes.forEach((me, i) => { const p = parts[i]; me.visible = !!p; if (p) { me.position.set(p.x, p.h, p.y); me.rotation.set(0, yaw, p.rot); } });
  fireflies.forEach(f => { f.me.visible = nt > .45; if (f.me.visible) f.me.position.set(P.x + f.ox + Math.sin(clock*.5 + f.ph)*.8, .5 + Math.abs(Math.sin(clock*.8 + f.ph))*1.4, P.y + f.oz + Math.cos(clock*.4 + f.ph)*.8); });
  for (const e of EYES) {
    const d = wdist(e.me.position.x, e.me.position.z, P.x, P.y); face(e.me); face(e.mk);
    e.me.visible = nt > .55 && d > 3 && d < 16 && Math.sin(clock*.8 + e.k) < .9;
    e.mk.visible = nt < .45 && d > 4 && d < 14 && Math.sin(clock*.3 + e.k) > -.2;   // 낮엔 원숭이가 수풀 사이로 내다봄
  }
  updateFire(dt, camX, camZ); updatePicks(camX, camZ); updateSmoke(dt, nt); updateWaterfall(dt, camX, camZ); updateLookout(camX, camZ); updateEnergy(dt); updateHints(dt, camX, camZ, nt); updateRibbons(camX, camZ); updateHammocks(dt, camX, camZ); updateLie(); updateAmbience(dt, nt);
  for (const o of scene.children) if (o.isMesh && !o.isInstancedMesh && o !== ground && o !== sky) { o.position.x = camX + wd(o.position.x - camX, W); o.position.z = camZ + wd(o.position.z - camZ, H); }
  renderer.render(scene, camera);
  if (sketchReq) { sketchReq = false; try { composeSketch(cv.toDataURL('image/jpeg', .9)); } catch (er) {} }

  // 겹쳐 그리기
  ctx.clearRect(0, 0, vw, vh);
  if (st > .02) {   // 빗줄기와 번개
    const f = clock*60 | 0, n = 220*st | 0; ctx.strokeStyle = 'rgba(230,236,226,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = hash(i*7 + f)*(vw + 100) - 50, y = hash(i*13 + f*3)*vh; ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 18); }
    ctx.stroke();
  }
  if (flash > .01) { ctx.fillStyle = `rgba(255,255,240,${flash*.55})`; ctx.fillRect(0, 0, vw, vh); }
  drawTwinkles(); drawFireOverlay(); drawEnergyOverlay(); drawTouchHelp(dt); drawFireArrow(); drawHintOverlay();
  if (sketchFlash > 0) { ctx.fillStyle = `rgba(255,250,235,${sketchFlash*1.6})`; ctx.fillRect(0, 0, vw, vh); sketchFlash -= dt; }
  drawObsOverlay(1, dt);
  ctx.font = '11px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const L of []) {   // 이름표 마을의 이름표는 뺌
    const near = wdist(L.x, L.y, P.x, P.y) < 1.9;
    L.a += ((near ? 1 : 0) - L.a) * Math.min(1, dt*12);
    if (L.a < .02) continue;
    const s = toScreen(L.x, 1.15 + .2*L.a, L.y); if (!s) continue;
    const [x, y] = s, w = ctx.measureText(L.text).width + 12;
    ctx.globalAlpha = L.a;
    ctx.fillStyle = 'rgba(255,248,230,.96)'; ctx.fillRect(x - w/2, y - 9, w, 18);
    ctx.beginPath(); ctx.moveTo(x - 4, y + 9); ctx.lineTo(x + 4, y + 9); ctx.lineTo(x, y + 14); ctx.fill();
    ctx.strokeStyle = '#8a4f2c'; ctx.lineWidth = 1; ctx.strokeRect(x - w/2 + .5, y - 8.5, w - 1, 17);
    ctx.fillStyle = '#4a2a16'; ctx.fillText(L.text, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'top';
  for (const o of others.values()) {
    if (wdist(o.rx, o.ry, P.x, P.y) > 18) continue;
    const s = toScreen(o.rx, 1.22 + elevAt(o.rx, o.ry), o.ry); if (!s) continue;
    ctx.fillStyle = 'rgba(30,24,64,.75)'; const w = ctx.measureText(o.name).width + 10; ctx.fillRect(s[0] - w/2, s[1] - 16, w, 15);
    ctx.fillStyle = '#f6ead2'; ctx.textAlign = 'center'; ctx.fillText(o.name, s[0], s[1] - 14);
  }
  const say = (x, h, z, b, kind) => { if (!b || b.until <= clock || wdist(x, z, P.x, P.y) > 14) return; const s = toScreen(x, h, z); if (s) drawBubble(s[0], s[1], b.text, kind); };
  PARROTS.forEach(p => say(p.x, .9, p.y, p.bubble, 'parrot'));
  say(oldman.position.x, 1.2, oldman.position.z, SITE.oldman.bubble, 'old');
  for (const o of others.values()) say(o.rx, 1.25 + elevAt(o.rx, o.ry), o.ry, o.bubble);
  say(P.x, 1.25 + elevP, P.y, myBubble);
  if (joy) { ctx.strokeStyle = 'rgba(246,234,210,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 40, 0, Math.PI*2); ctx.stroke(); }
  const n = others.size;
  $stat.innerHTML = `${label}${st > .2 ? ' · 폭풍' : ''} · ${n ? `함께 <b>${n + 1}</b>명` : '혼자'}`;
}

/* ---- 저장 (내 위치와 그림첩, 이 브라우저에) ---- */
const KEY = 'denggul-v3';
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ p:[P.x,P.y], found, c:clock })); } catch (e) {} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY)); if (!d) return false;
    if (!blocked(d.p[0], d.p[1])) { P.x = d.p[0]; P.y = d.p[1]; }
    if (d.found && typeof d.found === 'object') for (const s of SITES) if (d.found[s.key]) found[s.key] = d.found[s.key];
    clock = d.c || 0; return true;
  } catch (e) { return false; }
}
const returning = load();
paintAlbumBtn();
setInterval(save, 4000);
addEventListener('pagehide', save);

const $reset = document.getElementById('reset'); let armed = 0;
$reset.addEventListener('click', () => {
  if (!armed) { armed = setTimeout(() => { armed = 0; $reset.textContent = '처음부터'; }, 3000); $reset.textContent = '한 번 더 누르면 초기화'; return; }
  clearTimeout(armed); armed = 0; $reset.textContent = '처음부터';
  P.x = SX + .5; P.y = SY + 2.4; found = {}; clock = 0; save(); paintAlbumBtn(); sendPresence(true); cv.focus();
});

const touch = matchMedia('(pointer:coarse)').matches;
$hint.textContent = (returning ? '다시 왔네요. ' : '') + (touch ? '왼쪽을 끌어 걷고 오른쪽을 끌어 돌아보기 · 길을 잃으면 연기를 찾아요' : 'WASD로 걷기 · 마우스를 끌거나 Q·E로 돌아보기 · Enter로 말하기 · 길을 잃으면 고개를 들어 모닥불 연기를 찾아요') + ' · 앵무새 곁에서 한 말은 앵무새가 기억해요';
setTimeout(() => $hint.style.opacity = 0, 8000);

let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now - last)/1000); last = now; step(dt); draw(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
cv.focus();
if (!ME.name) openName();
connect();
</script>
