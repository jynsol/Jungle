<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>덩굴숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* 루소의 납작한 정글 + 멕시코 봉헌화(레타블로). HUD는 남색 판, 기록은 양철 액자 */
:root{
  --bg:#1a2a1e; --ink:#f6ead2; --dim:#c9bda4; --panel:rgba(30,24,64,.8); --line:rgba(246,234,210,.18);
  --marigold:#f2a93b; --rose:#ff5f8f; --teal:#2aa6a6; --paper:#f3e6c8; --brown:#4a2a16;
  --display:'Gowun Batang','Nanum Myeongjo',serif;
  --hand:'Nanum Pen Script','Gowun Batang',cursive;
  --body:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{overflow:hidden;font-family:var(--body)}
canvas#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
canvas#o{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  padding:10px 14px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hud h1{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.02em}
.hud .stat{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.hud .stat b{color:var(--marigold);font-weight:600}
.hud .bagi{display:flex;gap:12px;align-items:center;font:24px/1 "Nanum Pen Script",cursive;color:#f3e6c8;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.hud .bagi span{display:flex;align-items:center;gap:2px}
.hud .bagi img{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:4}
.tools:not(.open) > button:not(.leaf){display:none}
.tools button.leaf{order:-1;width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(20,18,40,.55);border:1px solid rgba(243,230,200,.25)}
.tools.open button.leaf{background:rgba(20,18,40,.85)}
.tools button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:12px var(--body);cursor:pointer}
.tools button:hover,.tools button:focus-visible{color:var(--ink);border-color:var(--dim)}
.tools #albumBtn{color:var(--marigold);border-color:rgba(242,169,59,.5)}
button:focus-visible,input:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 80px);
  width:max-content;max-width:calc(100vw - 32px);text-align:center;padding:8px 14px;font-size:13px;color:var(--dim);line-height:1.5;transition:opacity 1s;pointer-events:none}
.chat{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:min(360px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:flex;flex-direction:column;gap:6px;margin:0}
.log{display:flex;flex-direction:column;gap:3px;pointer-events:none}
.log div{align-self:flex-start;max-width:100%;padding:4px 9px;font-size:13px;line-height:1.45;overflow-wrap:anywhere;transition:opacity 1.2s}
.log div.old{opacity:0}
.log b{font-weight:600;margin-right:6px}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:14px var(--body)}
.row input::placeholder{color:var(--dim)}
.row button{background:var(--marigold);color:#3a2206;border:0;border-radius:6px;padding:0 14px;font:600 13px var(--body);cursor:pointer}

/* 레타블로 */
.veil{position:fixed;inset:0;background:rgba(14,10,36,.72);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));z-index:5}
.retablo{margin:0;padding:10px;border-radius:4px;width:100%;max-width:320px;
  background:repeating-conic-gradient(from 45deg,var(--marigold) 0 25%,var(--rose) 0 50%,var(--teal) 0 75%,#f6ead2 0 100%) 0 0/14px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.retablo canvas{display:block;width:100%;height:auto;aspect-ratio:28/17;border:3px solid #3a2410;background:#2b2a6e}
.retablo figcaption{background:var(--paper);color:var(--brown);padding:10px 12px 12px;border:3px solid #3a2410;border-top:0;font-family:var(--hand);display:flex;flex-direction:column;gap:2px}
.retablo .date{font-size:17px;opacity:.75}
.retablo b{font-size:25px;font-weight:400;line-height:1.1}
.retablo p{margin:2px 0 0;font-size:20px;line-height:1.25}
.retablo .with{font-size:17px;opacity:.75;margin-top:4px}
.retablo.empty{background:none;border:2px dashed var(--line);box-shadow:none;display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--dim);font:13px var(--body)}
.pop{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px}
.pop .tag{font:13px var(--body);letter-spacing:.12em;color:var(--marigold)}
.namebox{width:100%;max-width:340px;padding:22px;display:flex;flex-direction:column;gap:10px;margin:0}
.namebox h2{margin:0;font:700 22px var(--display)}
.namebox p{margin:0;color:var(--dim);font-size:13px}
.namebox input{background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:15px var(--body)}
.pop button,.album header button,.namebox button{background:var(--marigold);color:#3a2206;border:0;border-radius:6px;padding:10px 18px;font:600 14px var(--body);cursor:pointer}
.album{width:100%;max-width:1080px;max-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px;overflow:hidden}
.album header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.album h2{margin:0;font:700 22px var(--display)}
.album h2 span{font:13px var(--body);color:var(--dim);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;overflow-y:auto;padding:4px}
.grid .retablo{max-width:none}
@media (prefers-reduced-motion:reduce){.hint,.log div{transition:none}}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="정글 탐험 화면"></canvas>
<canvas id="o" aria-hidden="true"></canvas>
<div class="hud"><h1 hidden>덩굴숲</h1><div class="stat" id="stat" hidden>낮 · 혼자</div></div>
<div class="tools"><button id="nameBtn" type="button">이름</button><button id="albumBtn" type="button">그림첩 0/6</button><button id="sound" type="button">소리 켜기</button><button id="reset" type="button">처음부터</button></div>
<div class="hint panel" id="hint"></div>
<form class="chat" id="chat" autocomplete="off">
  <div class="log" id="log" aria-live="polite"></div>
  <div class="row"><input id="say" maxlength="80" placeholder="Enter 눌러 말하기" aria-label="채팅 입력"><button type="submit">말하기</button></div>
</form>
<div class="veil" id="popVeil" hidden><div class="pop"><span class="tag">새로운 기적</span><div id="popCard" style="width:100%;display:flex;justify-content:center"></div><button id="popClose" type="button">그림첩에 넣기</button></div></div>
<div class="veil" id="nameVeil" hidden><form class="namebox panel" id="nameForm"><h2>숲에서 불릴 이름</h2><p>함께 들어온 사람들 머리 위에 보여요.</p><input id="nameInput" maxlength="12" placeholder="예: 느린 앵무새" aria-label="이름"><button type="submit">숲으로 들어가기</button></form></div>
<div class="veil" id="albumVeil" hidden><div class="album panel"><header><h2>기적 그림첩<span id="albumCount"></span></h2><button id="albumClose" type="button">닫기</button></header><div class="grid" id="grid"></div></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
/* ================= 그래픽 교체용 =================
   assets/ 폴더에 아래 이름의 png를 넣으면 기본 그림 대신 그 그림판으로 바뀌어요. 크기와 비율은 README 참고.
   모두 정면에서 본 모습, 투명 배경, 아래가 땅에 닿게. */
const ASSET_NAMES = ['agave','grass','broadleaf','fern','lily','whitespike','heartleaf','banana','sansevieria','palm','tree','orangetree','lotus','flamingo','tiger','monkey','ruin','player','parrot','leaf','player_walk','butterfly','fire','log','cliff','waterfall_flow'];
// 아직 기본 그림인 것들: 파일을 넣으면 바로 바뀜 (목록과 크기는 ART_LIST.md)
ASSET_NAMES.push('galleon', 'galleon_front', 'piano', 'clock', 'gramophone', 'bicycle', 'mailbox', 'swing', 'chair', 'monkeys', 'whitebird', 'toucan', 'oldman', 'rock', 'fruit_banana', 'fruit_mango', 'fruit_cacao', 'bigtree', 'sloth_idle', 'sloth_eat', 'sloth_sleep', 'basket', 'basket_open', 'vine');
const ASSETS = Object.fromEntries(ASSET_NAMES.map(n => [n, 'assets/' + n + '.png']));
const ART = {};   // 그림 이름 → 그림이 오면 할 일 (그림판 바꾸고 비율 맞추기)
const onArt = (k, fn) => (ART[k] || (ART[k] = [])).push(fn);
const COLORS = {
  // 앙리 루소 「적도의 정글」(1909)에서 고른 색
  rousseau:{ deep:'#1c3428', dark:'#26443a', mid:'#355a45', sage:'#4d7356', moss:'#6a8a5a', pale:'#9db07a', agave:'#b9c98a', cream:'#ece6b4',
    vein:'#86a888', line:'#14261c', pink:'#ec9f86', pinkDeep:'#d77b66', white:'#f1edb6' },
  floor:'#3d5a3e', floorMark:'#56744f',
  leaves:['#2d4f3a','#4d7356','#26443a','#6a8a5a'], leafLine:'#14261c',
  flowers:['#ec9f86','#f1edb6','#d77b66'], flowerEye:'#e8c36a',
  tree:'#1c3428', water:'#3e6f6a', waterHi:'#8fb5a6', ruin:'#a58b6a', ruinLine:'#6e5a44', ruinDot:'#c9a46a',
  me:'#f2a93b', eye:'#1a120a', jaguar:'#ffd34a'
};
/* ================================================ */

const IMG = {};
// 그림이 다 올 때까지 숲을 가려 둠(기본 그림이 보였다가 바뀌지 않게). 그림은 늘 새로 확인해서 받음
{ const veil = document.createElement('div');
  veil.style.cssText = 'position:fixed;inset:0;z-index:50;background:#13201a;display:flex;align-items:center;justify-content:center;color:#cfc6a8;font:17px "Gowun Batang",serif;letter-spacing:.08em;transition:opacity .9s';
  veil.textContent = '숲으로 들어가는 중…'; document.body.append(veil);
  let left = 0, total = 0, done = false;
  const finish = () => { if (done) return; done = true; repaintRings(); veil.style.opacity = 0; veil.style.pointerEvents = 'none'; setTimeout(() => veil.remove(), 1000); };
  const one = () => { left--; veil.textContent = `숲으로 들어가는 중… ${total - left} / ${total}`; if (left <= 0) finish(); };
  for (const [k, src] of Object.entries(ASSETS)) if (src) { left++; total++;
    fetch(src, { cache:'no-cache' }).then(r => r.ok ? r.blob() : Promise.reject()).then(b => {
      const im = new Image(); im.onload = () => { IMG[k] = im; try { onAsset(k, im); } catch (e) {} one(); }; im.onerror = one; im.src = URL.createObjectURL(b);
    }).catch(one); }
  if (!left) finish(); setTimeout(finish, 45000);   // 새 그림이 다 올 때까지 예전 그림은 보이지 않게 (아주 느릴 때만 45초 뒤 열림)
}

const W = 96, H = 96, T = 28, DAY = 180;
const FLOOR = 0, BUSH = 1, TREE = 2, WATER = 3, RUIN = 4;
const SPEED = 3.2, BUSH_SPEED = 1.9;

const cv = document.getElementById('c'), ov = document.getElementById('o'), ctx = ov.getContext('2d');
let vw, vh;
function resize(){ const d = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight; ov.width = vw*d; ov.height = vh*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();

function rng(s){ return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise(seed, G = 64){
  const r = rng(seed), v = new Float32Array(G*G); for (let i = 0; i < v.length; i++) v[i] = r();
  const g = (a,b) => v[((a%G+G)%G) + ((b%G+G)%G)*G];
  return (x,y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x-xi, fy = y-yi, sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
    const a = g(xi,yi) + (g(xi+1,yi)-g(xi,yi))*sx, b = g(xi,yi+1) + (g(xi+1,yi+1)-g(xi,yi+1))*sx; return a + (b-a)*sy; };
}
const hash = k => { let h = Math.imul(k ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; return (Math.imul(h, 0xc2b2ae35) >>> 0) / 4294967296; };
const BAD = new RegExp('[' + [[0,31],[127,159],[173,173],[8203,8207],[8232,8238],[8288,8303],[65279,65279]].map(([a,b]) => String.fromCharCode(92)+'u'+a.toString(16).padStart(4,'0')+'-'+String.fromCharCode(92)+'u'+b.toString(16).padStart(4,'0')).join('') + ']', 'g');
const clean = s => String(s).replace(BAD, '').trim().slice(0, 80);

/* ---- 기적의 자리들 ---- */
const SITES = [
  { key:'labels', name:'꽃비 속의 빈 해먹', text:'온 마을이 한꺼번에 낮잠에 들었다가 어디론가 가 버렸다. 해먹마다 사람 모양으로 쌓인 노란 꽃잎만 남았다. 꽃비는 그날부터 그치지 않았다.' },
  { key:'rising', name:'빨래를 걷던 자리', text:'흰 이불을 개던 여자가 이불째 하늘로 올라갔다. 남은 사람들은 잠깐 올려다보고는 나머지 빨래를 마저 갰다.' },
  { key:'butterflies', name:'노란 나비 공터', text:'이 공터를 지난 사람 뒤로는 노란 나비가 따라붙는다. 아무도 이유를 묻지 않았고, 나비도 말하지 않았다.' },
  { key:'fork', name:'두 갈래 돌', text:'이 돌에서 길은 둘로 갈라진다. 어느 쪽을 골라도, 다른 쪽을 고른 내가 그 숲을 걷고 있다.' },
  { key:'mirror', name:'거울 연못', text:'연못에 비친 숲에는 아직 아무도 들어가 보지 않았다. 달은 그쪽 하늘에 하나 더 떠 있다.' },
  { key:'oldman', name:'백 살 노인의 돌', text:'돌 위의 노인은 백 년 전 장마 이야기를 어제 일처럼 했다. 그는 처음 보는 우리 이름을 이미 알고 있었다.' }
];
const OLDMAN_LINES = ['그해 비는 아무도 셀 수 없을 만큼 오래 왔지.', '자네 이름은 알아. 자네가 오기 전부터.', '길을 잃었다고? 여기선 다들 그렇게 도착하지.', '앵무새 말은 믿지 말게. 다 사람한테 배운 거야.'];
const PARROT_SEED = ['올라!', '비가 온다, 비가 온다', '이름을 잊지 마!', '길은 둘이야, 둘!', '누구 왔어? 누구 왔어?', '노란 나비! 노란 나비!'];

/* ---- 지도 (시드 고정이라 모두 같은 숲) ---- */
const R = rng(20261105), n1 = noise(11, 8), n2 = noise(29, 24);   // 지도 크기에 맞춰 반복되는 지형이라 끝과 끝이 이음매 없이 이어짐
const type = new Uint8Array(W*H), bent = new Float32Array(W*H), sway = new Float32Array(W*H);
const id = (x,y) => (((x % W) + W) % W) + (((y % H) + H) % H)*W;
const wd = (d, N) => d - N*Math.round(d/N);   // 이어진 숲에서의 가장 가까운 차이
const wdist = (ax, ay, bx, by) => Math.hypot(wd(ax - bx, W), wd(ay - by, H));
const wrapX = x => ((x % W) + W) % W, wrapY = y => ((y % H) + H) % H;
const border = () => false;   // 끝과 끝이 이어져 있어 가장자리가 없음
// 지역 넷: 모닥불에서 보는 방향마다 숲의 성격이 다름 (처음 바라보는 쪽이 북)
const REGIONS = [
  { key:'high', name:'높은 숲', ang:0 },      // 큰 나무와 넓은 잎, 덩굴
  { key:'flower', name:'꽃숲', ang:90 },     // 백합과 흰 꽃대
  { key:'water', name:'물가', ang:180 },      // 웅덩이와 고사리
  { key:'ruin', name:'폐허', ang:270 }        // 트인 땅, 산세베리아와 용설란
];
const RG_C = { x:(W/2|0) + .5, y:(H/2|0) + .5 };
function regionW(x, y){
  const dx = wd(x - RG_C.x, W), dy = wd(y - RG_C.y, H), d = Math.hypot(dx, dy), a = Math.atan2(dx, -dy), near = Math.max(0, Math.min(1, (d - 7)/12));
  return REGIONS.map(r => near*Math.max(0, Math.cos(a - r.ang*Math.PI/180))**2);
}
function regionAt(x, y){ const w = regionW(x, y); let bi = -1, bw = .45; w.forEach((v, i) => { if (v > bw) { bw = v; bi = i; } }); return bi; }
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const n = n1(x/12, y/12)*.65 + n2(x/4, y/4)*.35, rw = regionW(x + .5, y + .5); let t;
  if (n < .3 + .09*rw[2] - .06*rw[3]) t = WATER;
  else { const r = R(); t = r < .1 + .07*rw[0] - .06*rw[3] ? TREE : (n > .66 - .16*rw[3] - .05*rw[1] && r < .6) ? FLOOR : BUSH; }
  type[id(x,y)] = t;
}
const setT = (x,y,t) => { if (!border(x,y)) type[id(x,y)] = t; };
function clear(cx,cy,rad){ for (let y = Math.floor(cy-rad); y <= cy+rad; y++) for (let x = Math.floor(cx-rad); x <= cx+rad; x++) if ((x+.5-cx)**2 + (y+.5-cy)**2 <= rad*rad) setT(x,y,FLOOR); }
const SX = W/2|0, SY = H/2|0;
const FIRE = { x:SX+.5, y:SY+.5 };   // 출발점의 모닥불
SITES.forEach((s,i) => {
  let x, y, n = 0;
  do { x = 6 + R()*(W-13) | 0; y = 6 + R()*(H-13) | 0; n++; }
  while (((s.key === 'butterflies' ? (wdist(x, y, SX, SY) < 12 || wdist(x, y, SX, SY) > 16 || x - SX < 6) : wdist(x, y, SX, SY) < 14) || SITES.slice(0,i).some(o => wdist(o.x, o.y, x, y) < 16)) && n < 4000);

function step(dt){
  clock += dt;
  let dx = 0, dy = 0;
  if (!modalOpen()) {
    for (const c of keys) if (KEYMAP[c]) { dx += KEYMAP[c][0]; dy += KEYMAP[c][1]; }
    yaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, yaw + ((keys.has('KeyQ') ? 1 : 0) - (keys.has('KeyE') ? 1 : 0))*dt*1.8));
    if (joy) { const jx = joy.x-joy.sx, jy = joy.y-joy.sy, l = Math.hypot(jx,jy); if (l > 8) { dx = jx/Math.max(l,40); dy = jy/Math.max(l,40); } }
  }
  const len = Math.hypot(dx,dy); if (len > 1) { dx /= len; dy /= len; }
  P.moving = len > .05;
  if (P.moving) {
    // 화면 기준 입력(오른쪽 dx, 위쪽 -dy)을 숲 속 방향으로
    const wx = Math.cos(yaw)*dx + Math.sin(yaw)*dy, wz = -Math.sin(yaw)*dx + Math.cos(yaw)*dy;
    P.fx = wx; P.fy = wz;
    const sp = (tileAt(P.x,P.y) === BUSH ? BUSH_SPEED : SPEED) * dt * speedMul;
    const nx = P.x + wx*sp; if (!blocked(nx, P.y)) P.x = nx;
    const ny = P.y + wz*sp; if (!blocked(P.x, ny)) P.y = ny;
    pushOutTrees(); pushOutTrees();
    P.x = wrapX(P.x); P.y = wrapY(P.y);
  }
  disturb(P.x, P.y, dt, P.moving);
  for (const o of others.values()) {
    const f = Math.min(1, dt*10); o.rx = wrapX(o.rx + wd(o.x-o.rx, W)*f); o.ry = wrapY(o.ry + wd(o.y-o.ry, H)*f);
    disturb(o.rx, o.ry, dt, o.m);
  }
  for (let k = 0; k < W*H; k++) {
    if (sway[k] > 0) sway[k] = Math.max(0, sway[k] - dt*2.5);
    if (bent[k] > 0) bent[k] = Math.max(0, bent[k] - dt*.004);
  }
  for (let i = parts.length-1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vh = (p.vh ?? 1) - dt*2.2; p.h = Math.max(.02, (p.h ?? .7) + p.vh*dt); p.vx *= .92; p.vy *= .92; p.rot += dt*6;
  }

  if (Math.random() < dt*.6 && sheets.length < 14) sheets.push({ x:SITE.rising.cx + (Math.random()-.5), z:SITE.rising.cy + 1.2, h:1, life:22 });
  for (let i = sheets.length-1; i >= 0; i--) { const s = sheets[i]; s.life -= dt; s.h += dt*.85; if (s.life <= 0) sheets.splice(i,1); }
  PARROTS.forEach((p,i) => parrotTalk(p, i, dt));
  const om = SITE.oldman;
  if (wdist(P.x, P.y, om.cx + 1.6, om.cy) < 3) { if ((oldmanT -= dt) <= 0) { om.bubble = { text:OLDMAN_LINES[Math.random()*OLDMAN_LINES.length | 0], until:clock + 6 }; oldmanT = 8; } }
  for (const s of SITES) if (!found[s.key] && wdist(P.x, P.y, s.cx, s.cy) < 2.6) {
    found[s.key] = { date:today(), with:[...others.values()].map(o => o.name) };
    save(); paintAlbumBtn(); showFound(s); sendPresence(true);
  }
  rustle();
  sendPresence(false);
}

      s.m.scale.setScalar(1.6 + s.i*.2); s.m.material.opacity = (.12 + .14*nt)*Math.sin(s.t*Math.PI); s.m.lookAt(camera.position); }
  }
  // 이끼 낀 피아노
  const pia = STORIES.find(s => s.key === 'piano');
  if (pia) {
    const [qx, qz] = wrapNear(pia.x, pia.y, camX, camZ), ang = Math.atan2(camX - qx, camZ - qz), rx = Math.cos(ang), rz = -Math.sin(ang);
    const qd = wdist(P.x, P.y, pia.x, pia.y);
    for (const s of shafts) { s.m.visible = qd < 22;
      s.m.position.set(qx + rx*s.off - Math.sin(ang)*.3, 0, qz + rz*s.off - Math.cos(ang)*.3); s.m.rotation.set(0, ang, s.tilt);
      s.m.material.opacity = (day*.32 + nt*.12)*(1 - storm*.8)*(.85 + Math.sin(clock*.4 + s.off*3)*.15);
      s.m.material.color.set(nt > .5 ? '#9fb8e8' : '#fff4d8'); }
    for (const p of pianoMotes) { p.m.visible = qd < 14; if (!p.m.visible) continue;
      const k = (clock*.05 + p.i/16) % 1; p.m.position.set(qx + Math.sin(p.ph + clock*.2)*.9, .4 + k*4.5, qz + Math.cos(p.ph + clock*.15)*.6); p.m.lookAt(camera.position);
      p.m.material.opacity = .6*Math.sin(k*Math.PI); }
    if (qd < 13 && (melodyT -= dt) <= 0) { melodyT = .78; const f = MELODY[melodyI++ % MELODY.length]; if (f) pianoNote(f, .14*(1 - qd/13)); }
  }
}

function paintSail(c, n){
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1d2f45'); bg.addColorStop(1, '#2e4a3a'); g.fillStyle = bg; g.fillRect(0, 0, w, h);

  for (let i = 0; i < 16; i++) leafShape(g, (i*41) % w, h - 4, 50 + (i % 4)*14, -Math.PI/2 + (i % 5 - 2)*.35, COLORS.leaves[i % 4], .3);
  g.fillStyle = '#5a3c22'; g.strokeStyle = '#1a120a'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w*.22, h*.78); g.quadraticCurveTo(w*.5, h*.93, w*.78, h*.76); g.lineTo(w*.74, h*.7); g.lineTo(w*.26, h*.7); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#4a3020'; g.lineWidth = 6; g.beginPath(); g.moveTo(w*.5, h*.7); g.lineTo(w*.5, h*.1); g.stroke();
  const cells = [[0, 0], [1, 0], [0, 1], [1, 1]], sx = w*.5, top = h*.13, cw = w*.13, ch = h*.27;
  cells.forEach(([cx, cy], i) => {
    const x0 = sx + (cx ? 4 : -cw - 4), y0 = top + cy*(ch + 4);
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + cw, y0 + 4); g.lineTo(x0 + cw - 4, y0 + ch); g.lineTo(x0 + 3, y0 + ch - 6); g.closePath();
    if (i < n) { g.fillStyle = '#ece0bc'; g.fill(); g.strokeStyle = '#6b5236'; g.lineWidth = 2; g.stroke(); }
    else { g.setLineDash([6, 6]); g.strokeStyle = 'rgba(236,224,188,.55)'; g.lineWidth = 2; g.stroke(); g.setLineDash([]); }
  });
}

  bflyMeshes.forEach((me, i) => { const b = bf[i]; me.visible = !!b; if (b) { me.position.set(b[0], b[1], b[2]); me.rotation.y = yaw; me.scale.x = .3 + Math.abs(Math.sin(clock*16 + b[3]))*.9; } });
  leafMeshes.forEach((me, i) => { const p = parts[i]; me.visible = !!p; if (p) { me.position.set(p.x, p.h, p.y); me.rotation.set(0, yaw, p.rot); } });
  fireflies.forEach(f => { f.me.visible = nt > .45; if (f.me.visible) f.me.position.set(P.x + f.ox + Math.sin(clock*.5 + f.ph)*.8, .5 + Math.abs(Math.sin(clock*.8 + f.ph))*1.4, P.y + f.oz + Math.cos(clock*.4 + f.ph)*.8); });
  for (const e of EYES) {
    const d = wdist(e.me.position.x, e.me.position.z, P.x, P.y); face(e.me); face(e.mk);
    e.me.visible = nt > .55 && d > 3 && d < 16 && Math.sin(clock*.8 + e.k) < .9;
    e.mk.visible = nt < .45 && d > 4 && d < 14 && Math.sin(clock*.3 + e.k) > -.2;   // 낮엔 원숭이가 수풀 사이로 내다봄
  }
  updateFire(dt, camX, camZ); updatePicks(camX, camZ); updateSmoke(dt, nt); updateWaterfall(dt, camX, camZ); updateLookout(camX, camZ); updateEnergy(dt); updateHints(dt, camX, camZ, nt); updateScenes(dt, camX, camZ, nt, st); updatePuzzles(dt, camX, camZ); updateCompass(); updateRibbons(camX, camZ); updateHammocks(dt, camX, camZ); updateLie(); updateAmbience(dt, nt);
  for (const o of scene.children) if (o.isMesh && !o.isInstancedMesh && o !== ground && o !== sky) { o.position.x = camX + wd(o.position.x - camX, W); o.position.z = camZ + wd(o.position.z - camZ, H); }
  renderer.render(scene, camera);

  // 겹쳐 그리기
  ctx.clearRect(0, 0, vw, vh);
  if (st > .02) {   // 빗줄기와 번개
    const f = clock*60 | 0, n = 220*st | 0; ctx.strokeStyle = 'rgba(230,236,226,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = hash(i*7 + f)*(vw + 100) - 50, y = hash(i*13 + f*3)*vh; ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 18); }
    ctx.stroke();
  }
  if (flash > .01) { ctx.fillStyle = `rgba(255,255,240,${flash*.55})`; ctx.fillRect(0, 0, vw, vh); }
  drawTwinkles(); drawPickFx(); drawFireOverlay(); drawPuzzleOverlay(); drawEnergyOverlay(); drawTouchHelp(dt); drawHintOverlay();
  drawObsOverlay(1, dt);
  ctx.font = '11px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const L of []) {   // 이름표 마을의 이름표는 뺌
    const near = wdist(L.x, L.y, P.x, P.y) < 1.9;
    L.a += ((near ? 1 : 0) - L.a) * Math.min(1, dt*12);
    if (L.a < .02) continue;
    const s = toScreen(L.x, 1.15 + .2*L.a, L.y); if (!s) continue;
    const [x, y] = s, w = ctx.measureText(L.text).width + 12;
    ctx.globalAlpha = L.a;
    ctx.fillStyle = 'rgba(255,248,230,.96)'; ctx.fillRect(x - w/2, y - 9, w, 18);
    ctx.beginPath(); ctx.moveTo(x - 4, y + 9); ctx.lineTo(x + 4, y + 9); ctx.lineTo(x, y + 14); ctx.fill();
    ctx.strokeStyle = '#8a4f2c'; ctx.lineWidth = 1; ctx.strokeRect(x - w/2 + .5, y - 8.5, w - 1, 17);
    ctx.fillStyle = '#4a2a16'; ctx.fillText(L.text, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'top';
  for (const o of others.values()) {
    if (wdist(o.rx, o.ry, P.x, P.y) > 18) continue;
    const s = toScreen(o.rx, 1.22 + elevAt(o.rx, o.ry), o.ry); if (!s) continue;
    ctx.fillStyle = 'rgba(30,24,64,.75)'; const w = ctx.measureText(o.name).width + 10; ctx.fillRect(s[0] - w/2, s[1] - 16, w, 15);
    ctx.fillStyle = '#f6ead2'; ctx.textAlign = 'center'; ctx.fillText(o.name, s[0], s[1] - 14);
  }
  const say = (x, h, z, b, kind) => { if (!b || b.until <= clock || wdist(x, z, P.x, P.y) > 14) return; const s = toScreen(x, h, z); if (s) drawBubble(s[0], s[1], b.text, kind); };
  PARROTS.forEach(p => say(p.x, .9, p.y, p.bubble, 'parrot'));
  say(oldman.position.x, 1.2, oldman.position.z, SITE.oldman.bubble, 'old');
  for (const o of others.values()) say(o.rx, 1.25 + elevAt(o.rx, o.ry), o.ry, o.bubble);
  say(P.x, 1.25 + elevP, P.y, myBubble);
  if (joy) { ctx.strokeStyle = 'rgba(246,234,210,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 40, 0, Math.PI*2); ctx.stroke(); }
  const n = others.size;
  $stat.innerHTML = `${label}${st > .2 ? ' · 폭풍' : ''} · ${n ? `함께 <b>${n + 1}</b>명` : '혼자'}`;
}

/* ---- 저장 (내 위치와 그림첩, 이 브라우저에) ---- */
const KEY = 'denggul-v3';
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ p:[P.x,P.y], found, c:clock })); } catch (e) {} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY)); if (!d) return false;
    if (!blocked(d.p[0], d.p[1])) { P.x = d.p[0]; P.y = d.p[1]; }
    if (d.found && typeof d.found === 'object') for (const s of SITES) if (d.found[s.key]) found[s.key] = d.found[s.key];
    clock = d.c || 0; return true;
  } catch (e) { return false; }
}
const returning = load();
paintAlbumBtn();
setInterval(save, 4000);
addEventListener('pagehide', save);

const $reset = document.getElementById('reset'); let armed = 0;
$reset.addEventListener('click', () => {
  if (!armed) { armed = setTimeout(() => { armed = 0; $reset.textContent = '처음부터'; }, 3000); $reset.textContent = '한 번 더 누르면 초기화'; return; }
  clearTimeout(armed); armed = 0; $reset.textContent = '처음부터';
  P.x = SX + .5; P.y = SY + 2.4; found = {}; clock = 0; save(); paintAlbumBtn(); sendPresence(true); cv.focus();
});

const touch = matchMedia('(pointer:coarse)').matches;
$hint.hidden = true;   // 조작 설명은 띄우지 않음

let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now - last)/1000); last = now; step(dt); draw(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
cv.focus();
if (!ME.name) openName();
connect();
</script>
