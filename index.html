<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>덩굴숲</title>
<style>
  :root { --bg:#c8d3bf; --ink:#1f3326; --soft:#4d6a52; --card:#e4ead9; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; }
  h1 { font-size:28px; margin:0 0 6px; letter-spacing:-.5px; }
  p { margin:0 0 22px; color:var(--soft); line-height:1.5; }
  a { display:block; text-decoration:none; color:var(--ink); background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  a small { display:block; color:var(--soft); margin-top:2px; }
</style>
</head>
<body>
<main>
  <h1>덩굴숲</h1>
  <p>새 판을 만드는 중이에요. 지난 판은 아래에서 볼 수 있어요.</p>

  <a href="old2/">지난 판 2<small>2D 시험판</small></a>
  <a href="old3/">지난 판 3<small>1장 시험판 (나무 위 둥지)</small></a>
</main>
</body>
</html>
