<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>덩굴숲 1장</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#c8d3bf; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; font-family:sans-serif; }
  canvas#gl { display:block; width:100vw; height:100vh; }
  #inv { z-index:8; position:fixed; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:8px; padding:8px; border-radius:16px; background:rgba(28,40,32,.55); }
  #inv:empty { display:none; }
  .slot { width:58px; height:58px; border-radius:12px; background:rgba(240,234,208,.12); border:2px solid rgba(240,234,208,.25); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .slot.sel { border-color:#ffd56a; background:rgba(255,213,106,.25); transform:translateY(-6px); }
  .slot.on { border-color:#7fe0b0; background:rgba(127,224,176,.25); }
  .slot canvas { width:50px; height:50px; pointer-events:none; }
  .fx { position:fixed; pointer-events:none; width:56px; height:56px; transition:transform .6s ease-in, opacity .6s; z-index:5; }
  .no { position:fixed; pointer-events:none; color:#fff; font-size:34px; font-weight:bold; text-shadow:0 0 6px #000; z-index:5; animation:no .7s forwards; }
  @keyframes no { 0%{ transform:translate(-50%,-50%) scale(.6); opacity:1 } 30%{ transform:translate(-56%,-50%) scale(1) } 50%{ transform:translate(-44%,-50%) } 70%{ transform:translate(-50%,-50%); opacity:1 } 100%{ opacity:0 } }
  #hint { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translateX(-50%); background:#f4edd2; border:3px solid #3a2a1a; border-radius:22px; padding:10px; display:none; z-index:6; }
  #hint canvas { width:96px; height:96px; display:block; }
  #reset { position:fixed; right:calc(10px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); width:40px; height:40px; border-radius:50%; border:none; background:rgba(28,40,32,.5); cursor:pointer; padding:0; }
  #veil { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1.2s; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,120,100,.45) 100%); }
  #dim { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .7s; z-index:7; }
  #room { position:fixed; inset:0; background:#0c0806; display:none; z-index:6; }
  #room canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #fade { position:fixed; inset:0; background:#f4edd2; opacity:0; pointer-events:none; transition:opacity 2.5s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:24px; z-index:9; }
  #fade.show { opacity:1; pointer-events:auto; }
  #fade canvas { width:220px; height:220px; }
  #again { width:64px; height:64px; border-radius:50%; border:3px solid #3a2a1a; background:transparent; cursor:pointer; }

<body>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

/* ============ 저장 ============ */
const KEY = 'denggul-ch1-v1';
const FRESH = () => ({ inv:[], f:{}, nest:{}, x:1.0, z:6.6 });
let S = FRESH(); try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.f) S = Object.assign(FRESH(), s); } catch (e) {}
let saveT = 0; const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const has = k => S.inv.includes(k);
const take = k => { S.inv = S.inv.filter(i => i !== k); };
const give = k => { if (!has(k)) S.inv.push(k); };
const swapItem = (a, b) => { const i = S.inv.indexOf(a); if (i >= 0) S.inv[i] = b; else give(b); };

/* ============ 바탕 ============ */
const cvs = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas:cvs, antialias:true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene();
const SKY = new THREE.Color('#c8d3bf');
scene.background = SKY; scene.fog = new THREE.Fog(SKY, 28, 80);
const camera = new THREE.PerspectiveCamera(62, 1, .1, 200);
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const MOBILE = matchMedia('(pointer:coarse)').matches;

function ctex(w, h, paint){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); paint(g, w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.userData.canvas = c; return t; }
const rng = s => () => { s = (s*16807) % 2147483647; return (s - 1)/2147483646; };
const hash = n => { const x = Math.sin(n*127.1 + 311.7)*43758.5453; return x - Math.floor(x); };
const LINE = '#14261c';

/* ============ 그림판 (늘 카메라 쪽으로 몸을 돌리는 판) ============ */
const SHAKING = new Set();
const U = { uTime:{ value:0 }, uPlayer:{ value:new THREE.Vector3() } };
function billMat(tex, o = {}){
  return new THREE.ShaderMaterial({
    uniforms:{ map:{ value:tex }, uTime:U.uTime, fogColor:{ value:SKY }, fogNear:{ value:28 }, fogFar:{ value:80 }, uOpacity:{ value:1 }, uNear:{ value:o.near ?? 2.4 }, uSway:{ value:o.sway ?? 0 }, uFlip:{ value:0 }, uPush:{ value:o.push ?? 0 }, uGlow:{ value:o.glow ? 1 : 0 }, uPlayer:U.uPlayer, uOcc:{ value:o.occ ? 1 : 0 }, uShake:{ value:0 } },
    vertexShader:`uniform float uTime, uSway, uFlip, uPush, uOcc, uShake; uniform vec3 uPlayer; varying vec2 vUv; varying float vFog, vNear, vOcc, vDark;
      void main(){
        vec3 c = (instanceMatrix * vec4(0., 0., 0., 1.)).xyz; float sx = length(instanceMatrix[0].xyz), sy = length(instanceMatrix[1].xyz);
        vec3 t = cameraPosition - c; t.y = 0.; t = normalize(t + vec3(1e-4, 0., 0.)); vec3 right = vec3(t.z, 0., -t.x);
        float gust = smoothstep(.62, 1., .5 + .5*sin(uTime*.33 + c.x*.07 + c.z*.045)); float sway = sin(uTime*2.4 + c.x*.7 + c.z*.5)*uSway*position.y*position.y*gust;
        vec3 wp = c + right*(position.x + sway + sin(uTime*46.)*uShake*.06*(.4 + position.y))*sx + vec3(0., position.y*sy, 0.) + t*uPush;
        if (uOcc > .5 && uSway > 0. && sy < 3.) { vec2 dp = c.xz - uPlayer.xz; float pd = length(dp); float pk = smoothstep(1.3, .2, pd); float sd = dot(dp, right.xz) >= 0. ? 1. : -1.; wp += right*sd*pk*.32*position.y*sy*.55; wp.y -= pk*.08*position.y*sy; }
        vDark = smoothstep(17., 5., length(c.xz - vec2(2., 46.)))*.42;
        vec4 mv = viewMatrix*vec4(wp, 1.); gl_Position = projectionMatrix*mv;
        vUv = vec2(uFlip > .5 ? 1. - uv.x : uv.x, uv.y); vFog = -mv.z; vNear = length(cameraPosition.xz - c.xz);
        vOcc = 1.; if (uOcc > .5) { vec2 cp = cameraPosition.xz, ab = uPlayer.xz - cp; float tt = clamp(dot(c.xz - cp, ab)/max(dot(ab, ab), 1e-3), 0., 1.); float ds = length(c.xz - (cp + ab*tt)); if (tt < .9) vOcc = mix(.0, 1., smoothstep(.6 + sx*.25, 1.4 + sx*.35, ds)); }
      }`,
    fragmentShader:`uniform sampler2D map; uniform vec3 fogColor; uniform float fogNear, fogFar, uOpacity, uNear, uGlow; varying vec2 vUv; varying float vFog, vNear, vOcc, vDark;
      void main(){
        vec4 c = texture2D(map, vUv); if (c.a < .45) discard;
        float nf = uNear > 0. ? smoothstep(uNear*.45, uNear, vNear) : 1.;
        float d = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)))*43758.5453); if (d > nf*uOpacity*max(vOcc, .0)) discard;
        vec3 col = mix(c.rgb*(1. - (uGlow > .5 ? 0. : vDark)), fogColor, uGlow > .5 ? 0. : smoothstep(fogNear, fogFar, vFog)); gl_FragColor = vec4(col, 1.);
      }`
  });
}
const quad = (() => { const g = new THREE.PlaneGeometry(1, 1); g.translate(0, .5, 0); return g; })();
const M4 = new THREE.Matrix4(), Q0 = new THREE.Quaternion(), V3 = new THREE.Vector3(), SC = new THREE.Vector3();
/* 하나짜리 판: b.at(x,y,z) b.size(w,h) */
function bill(tex, w, h, x, y, z, o){
  const m = new THREE.InstancedMesh(quad, billMat(tex, o), 1); m.frustumCulled = false; scene.add(m);
  const b = { m, w, h, x, y, z, at(x, y, z){ this.x = x; this.y = y; this.z = z; this.upd(); return this; }, size(w, h){ this.w = w; this.h = h; this.upd(); return this; },
    upd(){ M4.compose(V3.set(this.x, this.y, this.z), Q0, SC.set(this.w, this.h, 1)); m.setMatrixAt(0, M4); m.instanceMatrix.needsUpdate = true; },
    set visible(v){ m.visible = v; }, get visible(){ return m.visible; }, set op(v){ m.material.uniforms.uOpacity.value = v; }, shake(){ m.material.uniforms.uShake.value = 1; SHAKING.add(m.material.uniforms.uShake); } };
  b.upd(); return b;
}
/* 고정된 판(벽, 문, 줄): 한쪽을 바라봄 */
function flat(tex, w, h, x, y, z, rotY = 0, o = {}){
  const g = new THREE.PlaneGeometry(w, h); if (!o.center) g.translate(0, h/2, 0);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map:tex, transparent:!!o.blend, alphaTest:o.blend ? 0 : .45, side:THREE.DoubleSide, fog:!o.glow, depthWrite:!o.blend, blending:o.add ? THREE.AdditiveBlending : THREE.NormalBlending, opacity:o.opacity ?? 1 }));
  m.position.set(x, y, z); m.rotation.y = rotY; scene.add(m); return m;
}

/* ============ 지도 ============ */
const CLEAR_R = 7.5, TRUNK_R = 1.0, TREE_H = 5;
const ROAD_CP = [[4.6,-5.6],[9,-11],[14,-19],[20,-25],[27,-27],[33,-20],[34,-8],[32,5],[26,17],[14,25],[0,27],[-13,25],[-24,17],[-30,5],[-31,-8],[-26,-19],[-16,-24],[-9,-17],[-6,-10],[-4.6,-5.6]];
const FLOWER_CP = [[4.8,4.8],[9,9],[15,15],[23,21],[30,29],[36,38],[41,48]];
/* 장소: 큰길에서 오솔길로 들어감 (오두막은 조금, 빨래터는 중간, 반딧불 덤불은 깊이) */
const PLACES = {
  creek:{ x:30, z:-31.8, r:3.8 },
  hut:{ x:44, z:-5, r:5, block:(x, z) => x > 48.2 },
  ff:{ x:2, z:44, r:6, block:(x, z) => x > 3.8 && x < 7.2 && z > 47.3 },
  laundry:{ x:-46, z:-3, r:5, block:(x, z) => x < -50.2 }
};
const SIDE_CP = [
  [[25,-26.5],[26.5,-29.5],[29,-30.2],[30,-31.8]],
  [[33.6,-6],[37,-3.2],[40,-6.8],[42.5,-4],[44,-5]],
  [[-30.5,-2],[-34,1.8],[-37.5,-1.8],[-41,1],[-44,-1.5],[-46,-3]],
  [[-1,27.5],[2.5,31.5],[-1.5,35],[1.2,38.5],[4,40.8],[2,44]]
];
function catmull(P, step = .5){ const out = [];
  for (let i = 0; i < P.length - 1; i++) { const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), n = Math.max(2, Math.ceil(L/step));
    for (let k = 0; k < n; k++) { const t = k/n, t2 = t*t, t3 = t2*t; const f = (a, b, c, d) => .5*((2*b) + (-a + c)*t + (2*a - 5*b + 4*c - d)*t2 + (-a + 3*b - 3*c + d)*t3); out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]); } }
  out.push(P[P.length - 1]); return out; }
/* 곧은 데 없이 구불구불하게: 양 끝과 공터 근처는 그대로 둠 */
function wiggle(P, amp, seed, ends = 4){ let L = 0; const len = []; P.forEach((p, i) => { if (i) L += Math.hypot(p[0] - P[i - 1][0], p[1] - P[i - 1][1]); len.push(L); });
  return P.map((p, i) => { const a = P[Math.max(0, i - 2)], b = P[Math.min(P.length - 1, i + 2)], tx = b[0] - a[0], tz = b[1] - a[1], tl = Math.hypot(tx, tz) || 1;
    const k = Math.max(0, Math.min(1, (Math.hypot(p[0], p[1]) - 8)/6, len[i]/ends, (L - len[i])/ends));
    const off = amp*k*(Math.sin(len[i]/8.5 + seed) + .55*Math.sin(len[i]/3.7 + seed*2)); return [p[0] - tz/tl*off, p[1] + tx/tl*off]; }); }
const dPoly = (P, x, z) => { let m = 1e9; for (const p of P) { const d = (p[0] - x)**2 + (p[1] - z)**2; if (d < m) m = d; } return Math.sqrt(m); };
const nearOn = (P, x, z) => { let m = 1e9, q = P[0]; for (const p of P) { const d = (p[0] - x)**2 + (p[1] - z)**2; if (d < m) { m = d; q = p; } } return q; };
const ROAD = wiggle(catmull(ROAD_CP), 2.0, 1.3, 1), FPATH = wiggle(catmull(FLOWER_CP), 1.4, 4.1);
const SIDES = SIDE_CP.map((cp, i) => { const c = cp.slice(); c[0] = nearOn(ROAD, c[0][0], c[0][1]); return wiggle(catmull(c, .4), .7, i*2.3 + .5, 2.5); });
const zs = x => -46 + 9.5*Math.exp(-(((x - 31)/14)**2)) + 1.2*Math.sin(x/6);
const inWater = (x, z) => Math.abs(z - zs(x)) < 2.4;
const NB = { x:31, z:-45, r:5.2 };
const CORE_W = 1.6, SIDE_W = .95, THICK = 1.7;
/* 길 가장자리까지 거리 (미리 계산) */
const DG = .5, DN = 300, D0 = -75, DGRID = new Float32Array(DN*DN);
for (let j = 0; j < DN; j++) for (let i = 0; i < DN; i++) { const x = D0 + (i + .5)*DG, z = D0 + (j + .5)*DG; let d = dPoly(ROAD, x, z) - CORE_W; if (d < 12) for (const sp of SIDES) d = Math.min(d, dPoly(sp, x, z) - SIDE_W); else for (const sp of SIDES) { const e = dPoly(sp, x, z) - SIDE_W; if (e < d) d = e; } DGRID[j*DN + i] = d; }
const edge = (x, z) => { const i = Math.floor((x - D0)/DG), j = Math.floor((z - D0)/DG); return i < 0 || j < 0 || i >= DN || j >= DN ? 99 : DGRID[j*DN + i]; };
function blocked(x, z){ if (Math.hypot(x, z) < TRUNK_R + .45) return true; for (const k in PLACES) { const p = PLACES[k]; if (p.block && Math.hypot(x - p.x, z - p.z) < p.r + THICK + 1.5 && p.block(x, z)) return true; } return false; }
/* 길 위 (빠르게 걷는 곳) */
function core(x, z){
  if (blocked(x, z)) return false;
  if (Math.hypot(x, z) < CLEAR_R) return true;
  if (S.f.pads) for (const p of PADS) if (Math.hypot(x - p.x, z - p.z) < .68) return true;
  if (inWater(x, z)) return false;
  if (S.f.maskOn && dPoly(FPATH, x, z) < 1.4) return true;
  for (const k in PLACES) { const p = PLACES[k]; if (Math.hypot(x - p.x, z - p.z) < p.r) return true; }
  if (Math.hypot(x - NB.x, z - NB.z) < NB.r) return true;
  if (x > 21 && x < 37) { const dz = z - zs(x); if (dz > 2.4 && dz < 5.5) return true; }
  return edge(x, z) < 0;
}
/* 덤불 속 (헤치고 들어갈 수 있는 곳) */
function thick(x, z){
  if (blocked(x, z) || inWater(x, z) || Math.abs(z - zs(x)) < 2.9 && Math.hypot(x - NB.x, z - NB.z) > NB.r) return false;
  if (Math.hypot(x, z) < CLEAR_R + 1.8) return true;
  for (const k in PLACES) { const p = PLACES[k]; if (Math.hypot(x - p.x, z - p.z) < p.r + 1.8) return true; }
  return edge(x, z) < THICK;
}
const walkable = (x, z) => core(x, z) || thick(x, z);

/* ============ 땅 ============ */
const GW = 160, GT = 2048, g2c = v => (v + GW/2)/GW*GT;
const groundTex = ctex(GT, GT, (g) => {
  const r = rng(7);
  g.fillStyle = '#3d5a3e'; g.fillRect(0, 0, GT, GT);
  for (let i = 0; i < 9000; i++) { g.fillStyle = ['#36533a', '#46664a', '#3a5a3a', '#4d6d4a'][i % 4]; g.globalAlpha = .5; g.beginPath(); g.ellipse(r()*GT, r()*GT, 3 + r()*10, 2 + r()*5, r()*3, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  // 공터
  const cg = g.createRadialGradient(g2c(0), g2c(0), 10, g2c(0), g2c(0), CLEAR_R/GW*GT); cg.addColorStop(0, '#7d8a5a'); cg.addColorStop(.85, '#6e8058'); cg.addColorStop(1, 'rgba(110,128,88,0)');
  g.fillStyle = cg; g.beginPath(); g.arc(g2c(0), g2c(0), CLEAR_R/GW*GT, 0, 7); g.fill();
  // 장소들
  for (const k in PLACES) { const p = PLACES[k], rr = p.r/GW*GT; const pg = g.createRadialGradient(g2c(p.x), g2c(p.z), 4, g2c(p.x), g2c(p.z), rr); pg.addColorStop(0, '#8a8a5e'); pg.addColorStop(.8, '#7a7e56'); pg.addColorStop(1, 'rgba(122,126,86,0)'); g.fillStyle = pg; g.beginPath(); g.arc(g2c(p.x), g2c(p.z), rr, 0, 7); g.fill(); }
  { const rr = NB.r/GW*GT; g.fillStyle = '#7a7e56'; g.beginPath(); g.arc(g2c(NB.x), g2c(NB.z), rr, 0, 7); g.fill(); }
  // 큰길
  const strokePath = (P, w, col) => { g.strokeStyle = col; g.lineWidth = w/GW*GT; g.lineCap = g.lineJoin = 'round'; g.beginPath(); P.forEach((p, i) => i ? g.lineTo(g2c(p[0]), g2c(p[1])) : g.moveTo(g2c(p[0]), g2c(p[1]))); g.stroke(); };
  strokePath(ROAD, 3.6, '#7e7048'); strokePath(ROAD, 2.8, '#a08a5a');
  for (const sp of SIDES) { strokePath(sp, 2.0, 'rgba(110,100,64,.8)'); strokePath(sp, 1.3, 'rgba(140,124,80,.75)'); }
  { const fg = g.createRadialGradient(g2c(2), g2c(44), 10, g2c(2), g2c(44), 16/GW*GT); fg.addColorStop(0, 'rgba(10,20,16,.45)'); fg.addColorStop(1, 'rgba(10,20,16,0)'); g.fillStyle = fg; g.fillRect(0, 0, GT, GT); }
  for (let i = 0; i < ROAD.length; i += 3) { const p = ROAD[i]; g.fillStyle = 'rgba(80,64,40,.35)'; g.beginPath(); g.arc(g2c(p[0] + (r() - .5)*2), g2c(p[1] + (r() - .5)*2), 2 + r()*3, 0, 7); g.fill(); }
  // 개울
  for (let x = -GW/2; x < GW/2; x += .25) { const z = zs(x); g.fillStyle = '#2f5a58'; g.fillRect(g2c(x), g2c(z - 2.6), GT/GW*.3, 5.2/GW*GT); g.fillStyle = '#3e6f6a'; g.fillRect(g2c(x), g2c(z - 2.2), GT/GW*.3, 4.4/GW*GT); }
  for (let i = 0; i < 500; i++) { const x = (r() - .5)*GW, z = zs(x) + (r() - .5)*3.6; g.strokeStyle = 'rgba(200,230,230,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(g2c(x), g2c(z)); g.lineTo(g2c(x + .8), g2c(z)); g.stroke(); }
});
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(GW, GW), new THREE.MeshBasicMaterial({ map:groundTex })); m.rotation.x = -Math.PI/2; scene.add(m); }
